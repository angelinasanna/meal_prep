<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    html, body { margin: 0; background: var(--bg); }

    /* ── Banner ── */
    .landing-banner {
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(40px, 8vw, 72px) 24px;
    }

    #mise-stage {
      width: min(80vw, 520px);
      display: block;
    }

    .mise-text {
      fill: white;
      fill-opacity: 0;
      stroke: white;
      stroke-width: 1.4;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.22));
    }

    /* ── Content below banner ── */
    .landing-content {
      text-align: center;
      padding: clamp(36px, 6vw, 60px) 24px clamp(48px, 8vw, 80px);
      max-width: 480px;
      margin: 0 auto;
    }

    .landing-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      font-weight: 600;
      font-style: italic;
      color: var(--black);
      line-height: 1.2;
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(12px);
    }

    .landing-sub {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--text-3);
      line-height: 1.7;
      margin-bottom: 32px;
      opacity: 0;
      transform: translateY(12px);
    }

    .landing-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(12px);
    }

    .btn-landing {
      display: inline-block;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.03em;
      padding: 13px 44px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 150ms ease, transform 150ms ease, color 150ms ease;
    }
    .btn-landing-primary {
      background: var(--green);
      color: white;
    }
    .btn-landing-primary:hover {
      background: var(--green-2);
      transform: translateY(-1px);
      text-decoration: none;
      color: white;
    }
    .btn-landing-ghost {
      background: transparent;
      color: var(--text-3);
      border: 1.5px solid var(--border-dk);
    }
    .btn-landing-ghost:hover {
      background: var(--border);
      color: var(--black);
      transform: translateY(-1px);
      text-decoration: none;
    }
  </style>
</head>
<body>

<!-- Banner -->
<div class="landing-banner">
  <svg id="mise-stage" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet">
    <text
      id="mise-text"
      class="mise-text"
      x="400"
      y="195"
      text-anchor="middle"
      font-family="Sacramento, cursive"
      font-size="210"
    >Mise</text>
  </svg>
</div>

<!-- Info -->
<div class="landing-content">
  <h1 class="landing-title" id="landing-title">Everything in its place.</h1>
  <p class="landing-sub" id="landing-sub">Smart meal suggestions that share ingredients — less shopping, less waste, more variety.</p>
  <div class="landing-btns" id="landing-btn">
    {% if has_prefs %}
      <a href="/dashboard" class="btn-landing btn-landing-primary">View my plan</a>
      <a href="/onboarding" class="btn-landing btn-landing-ghost">Start over</a>
    {% else %}
      <a href="/onboarding" class="btn-landing btn-landing-primary">Get started</a>
    {% endif %}
  </div>
</div>

<script>
document.fonts.ready.then(function() {
  var textEl = document.getElementById('mise-text');

  var bbox      = textEl.getBBox();
  var strokeLen = Math.ceil((bbox.width + bbox.height) * 8);
  textEl.style.strokeDasharray  = strokeLen;
  textEl.style.strokeDashoffset = strokeLen;

  var drawDelay    = 180;
  var drawDuration = 1100;
  var fillDelay    = drawDelay + drawDuration;
  var fillDuration = 320;
  var contentDelay = fillDelay + fillDuration + 200;
  var stagger      = 110;

  setTimeout(function() {
    textEl.style.transition = 'stroke-dashoffset ' + drawDuration + 'ms cubic-bezier(0.3, 0, 0.6, 1)';
    textEl.style.strokeDashoffset = '0';
  }, drawDelay);

  setTimeout(function() {
    textEl.style.transition += ', fill-opacity ' + fillDuration + 'ms ease';
    textEl.style.fillOpacity = '1';
  }, fillDelay);

  var els = [
    document.getElementById('landing-title'),
    document.getElementById('landing-sub'),
    document.getElementById('landing-btn'),
  ];

  var fadeIn = 'opacity 550ms ease, transform 550ms cubic-bezier(0.16, 1, 0.3, 1)';
  els.forEach(function(el, i) {
    setTimeout(function() {
      el.style.transition = fadeIn;
      el.style.opacity    = '1';
      el.style.transform  = 'translateY(0)';
    }, contentDelay + i * stagger);
  });
});
</script>
</body>
</html>
