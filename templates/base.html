<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mealprepped{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/reset" class="logo">
      <div class="logo-icon">
        <!-- salad bowl SVG -->
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 13h16"/>
          <path d="M4 13c0 4 3.6 7 8 7s8-3 8-7"/>
          <path d="M9 13c0-3.5 1.3-6 3-6 0 2.5-1.3 5-3 6z"/>
          <path d="M13 13c0-3.5 1.3-6 3-5.5 0 2.5-1.3 4.5-3 5.5z"/>
          <path d="M11 13c-.5-3 .5-5 2-4.5"/>
        </svg>
      </div>
      <span class="logo-text">mealprepped</span>
    </a>

    {% block steps %}{% endblock %}
  </div>
</header>

<main>
  <div class="container page-content">
    {% block content %}{% endblock %}
  </div>
</main>

<script src="/static/js/main.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
