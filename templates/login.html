<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Sacramento&family=Caveat:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v={{ css_v }}" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #f0ebe2;
      background-image:
        linear-gradient(rgba(240,235,226,0.78), rgba(240,235,226,0.78)),
        url('/static/food-doodle.jpg');
      background-size: 45% auto;
      background-repeat: repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(32px, 7vw, 72px) 20px;
      box-sizing: border-box;
    }

    .login-card {
      background: #fff;
      border-radius: 22px;
      padding: clamp(28px, 6vw, 48px);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.09), 0 2px 8px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }

    .login-wordmark {
      font-family: 'Cofenauts', sans-serif;
      font-size: 6rem;
      color: var(--black);
      margin: 0 0 28px;
      line-height: 1;
      text-align: center;
    }

    .login-heading {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text-2);
      margin: 0 0 22px;
      text-align: left;
    }

    .login-google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: .875rem;
      font-weight: 600;
      color: var(--black);
      text-decoration: none;
      box-sizing: border-box;
      transition: background 140ms, border-color 140ms;
    }
    .login-google-btn:hover {
      background: #f5f3ef;
      border-color: var(--border-dk);
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
    }
    .login-divider-line { flex: 1; height: 1px; background: var(--border); }
    .login-divider-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .login-form { display: flex; flex-direction: column; gap: 14px; }

    .login-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--text-2);
      display: block;
      margin-bottom: 5px;
    }

    .login-input {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: .9rem;
      background: #faf8f5;
      color: var(--black);
      outline: none;
      width: 100%;
      box-sizing: border-box;
      transition: border-color 140ms;
    }
    .login-input:focus { border-color: var(--green); }
    .login-input::placeholder { color: var(--text-3); }

    .login-skip {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: .78rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-top: 16px;
    }
    .login-skip a { color: var(--text-3); text-decoration: underline; }
    .login-skip a:hover { color: var(--black); }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-wordmark">Menu</div>
    <p class="login-heading">Sign in</p>

    <a href="/auth/google" class="login-google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48" style="display:block;flex-shrink:0;">
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.97 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      </svg>
      Continue with Google
    </a>

    <div class="login-divider">
      <div class="login-divider-line"></div>
      <span class="login-divider-text">or</span>
      <div class="login-divider-line"></div>
    </div>

    <form action="/login" method="post" class="login-form">
      <div>
        <label class="login-label">Name</label>
        <input type="text" name="name" placeholder="Your name" autocomplete="name" class="login-input" />
      </div>
      <div>
        <label class="login-label">Email</label>
        <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required class="login-input" />
      </div>
      <button type="submit" class="btn btn-primary btn-no-arrow" style="width:100%;margin-top:4px;">Continue</button>
    </form>
  </div>


</body>
</html>
