{% extends "base.html" %}
{% block title %} · Choose mode{% endblock %}

{% block extra_styles %}
<style>
.mode-wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: clamp(28px, 5vw, 48px) clamp(16px, 5vw, 40px) clamp(60px, 10vw, 120px);
}
.mode-heading {
  font-family: 'Caveat', cursive;
  font-size: clamp(2rem, 4.5vw, 3rem);
  font-weight: 700;
  font-style: normal;
  color: var(--black);
  margin-bottom: 6px;
}
.mode-sub {
  color: var(--text-3);
  font-size: .9rem;
  margin-bottom: clamp(28px, 5vw, 48px);
}

/* ── Layout ── */
.mode-cards-row {
  display: flex;
  align-items: stretch;
  gap: 20px;
}
.mode-or {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 0 4px;
  gap: 10px;
  flex-shrink: 0;
}
.mode-or-line { width: 1px; flex: 1; background: var(--border); }
.mode-or-text {
  font-family: 'Kalam', cursive;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-3);
}
@media (max-width: 600px) {
  .mode-cards-row { flex-direction: column; gap: 0; }
  .mode-or { flex-direction: row; padding: 12px 0; }
  .mode-or-line { width: auto; flex: 1; height: 1px; }
}

/* ── Card ── */
.notebook-card {
  position: relative;
  flex: 1;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: #fff;
  border-radius: 16px;
  padding: clamp(28px, 4vw, 44px) clamp(24px, 3vw, 40px);
  text-align: left;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
  transition: transform .2s, box-shadow .2s, border-color .2s;
  overflow: hidden;
}

/* doodle layer — hidden by default, revealed on hover */
.notebook-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url('/static/food-doodle.jpg') center / cover no-repeat;
  opacity: 0;
  transition: opacity .3s ease;
  border-radius: 14px;
  pointer-events: none;
}
/* white wash over the doodle so it stays very faint */
.notebook-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,.88);
  opacity: 0;
  transition: opacity .3s ease;
  border-radius: 14px;
  pointer-events: none;
}
.notebook-card:hover::before,
.notebook-card:hover::after { opacity: 1; }

.notebook-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 28px rgba(0,0,0,.1);
  border-color: var(--green);
}

/* ── Text (must sit above the pseudo-element layers) ── */
.notebook-card-title {
  font-family: inherit;
  font-size: clamp(.65rem, 1.2vw, .75rem);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}
.notebook-card-desc {
  font-size: .875rem;
  color: var(--black);
  line-height: 1.65;
  position: relative;
  z-index: 1;
}
.notebook-card-arrow {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: .8rem;
  font-weight: 700;
  color: var(--green);
  letter-spacing: .03em;
  position: relative;
  z-index: 1;
}
</style>
{% endblock %}

{% block content %}
<div class="mode-wrap">
  <h1 class="mode-heading">Where do you want to start?</h1>
  <p class="mode-sub">Choose how you want to build your meal plan.</p>

  <div class="mode-cards-row">

    <!-- Recipe suggestions -->
    <form id="form-suggestions" action="/mode" method="post" style="flex:1;display:flex;">
      <input type="hidden" name="mode" value="suggestions" />
      <button type="button" class="notebook-card" data-form="form-suggestions">
        <div class="notebook-card-title">Recipe suggestions</div>
        <div class="notebook-card-desc">Get recipe ideas built around shared ingredients. Browse and add what you want, we build your grocery list automatically.</div>
        <div class="notebook-card-arrow">Get started <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </button>
    </form>

    <!-- Or divider -->
    <div class="mode-or">
      <div class="mode-or-line"></div>
      <span class="mode-or-text">or</span>
      <div class="mode-or-line"></div>
    </div>

    <!-- Use my ingredients -->
    <form id="form-existing" action="/mode" method="post" style="flex:1;display:flex;">
      <input type="hidden" name="mode" value="existing" />
      <button type="button" class="notebook-card" data-form="form-existing">
        <div class="notebook-card-title">Use my ingredients</div>
        <div class="notebook-card-desc">Tell us what you already have. We suggest recipes that use them and only list the gaps on your grocery list.</div>
        <div class="notebook-card-arrow">Get started <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </button>
    </form>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
  document.querySelectorAll('.notebook-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var form = document.getElementById(card.getAttribute('data-form'));
      if (form) form.submit();
    });
  });
})();
</script>
{% endblock %}
