{% extends "base.html" %}
{% block title %} · Choose mode{% endblock %}

{% block extra_styles %}
<style>
.mode-wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: clamp(28px, 5vw, 48px) clamp(16px, 5vw, 40px) clamp(60px, 10vw, 120px);
}

.mode-heading {
  font-family: 'Kalam', cursive;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 700;
  color: var(--black);
  margin-bottom: 6px;
}

.mode-sub {
  color: var(--text-3);
  font-size: .9rem;
  margin-bottom: clamp(28px, 5vw, 48px);
}

/* ── Layout ── */
.mode-cards-row {
  display: flex;
  align-items: stretch;
  gap: 0;
}
.mode-or {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 0 clamp(12px, 2vw, 24px);
  gap: 10px;
  flex-shrink: 0;
}
.mode-or-line {
  width: 1px;
  flex: 1;
  background: var(--border);
}
.mode-or-text {
  font-family: 'Kalam', cursive;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-3);
}
@media (max-width: 600px) {
  .mode-cards-row { flex-direction: column; }
  .mode-or { flex-direction: row; padding: 12px 0; }
  .mode-or-line { width: auto; flex: 1; height: 1px; }
}

/* ── Notebook card ── */
.notebook-card {
  position: relative;
  flex: 1;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  text-align: left;
  transition: transform .18s;
}
.notebook-card:hover { transform: translateY(-3px); }
.notebook-card.peeling { transform: none; cursor: default; }

/* ── Paper body ── */
.notebook-inner {
  position: relative;
  background-color: #faf5e8;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 27px,
      rgba(110,160,200,.42) 27px,
      rgba(110,160,200,.42) 28px
    );
  background-attachment: local;
  border: 1px solid #cfc4a8;
  border-left: none;
  border-radius: 0 10px 10px 0;
  padding: clamp(28px, 4vw, 48px) clamp(20px, 3vw, 36px) clamp(28px, 4vw, 48px) clamp(52px, 7vw, 72px);
  min-height: 320px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
  box-shadow:
    3px 5px 18px rgba(80,55,15,.2),
    -1px 0 0 rgba(160,140,110,.3),
    inset 0 1px 0 rgba(255,255,255,.55);
  transition: box-shadow .18s;
}
.notebook-card:hover .notebook-inner {
  box-shadow:
    5px 12px 32px rgba(80,55,15,.22),
    -1px 0 0 rgba(160,140,110,.3),
    inset 0 1px 0 rgba(255,255,255,.55);
}

/* red margin line */
.notebook-inner::before {
  content: '';
  position: absolute;
  left: clamp(40px, 6vw, 56px);
  top: 0; bottom: 0;
  width: 1.5px;
  background: rgba(195,65,55,.3);
  pointer-events: none;
}

/* torn left edge shadow */
.notebook-inner::after {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 44px;
  background: linear-gradient(
    to right,
    rgba(100,80,50,.22) 0%,
    rgba(100,80,50,.1) 55%,
    transparent 100%
  );
  pointer-events: none;
  z-index: 1;
}

/* ── Hole punches ── */
.notebook-holes {
  position: absolute;
  left: clamp(12px, 2vw, 20px);
  top: 22px;
  bottom: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  pointer-events: none;
  z-index: 5;
}
.notebook-hole {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #ede7d6;
  border: 1.5px solid #a89878;
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.22),
    inset 0 -1px 0 rgba(255,255,255,.25),
    0 1px 0 rgba(255,255,255,.4);
}

/* ── Text ── */
.notebook-card-title {
  font-family: 'Caveat', cursive;
  font-size: clamp(1.4rem, 3vw, 1.85rem);
  font-weight: 700;
  color: var(--black);
  line-height: 28px;
  margin-bottom: 10px;
}
.notebook-card-desc {
  font-size: .8375rem;
  color: var(--text-3);
  line-height: 28px;
}
.notebook-card-arrow {
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: .8rem;
  font-weight: 700;
  color: var(--green);
  letter-spacing: .03em;
  line-height: 28px;
}

/* ── Peel corner ── */
.peel-corner {
  position: absolute;
  bottom: 0; right: 0;
  width: 34px; height: 34px;
  background: linear-gradient(
    135deg,
    transparent 0px,
    rgba(0,0,0,.0) 18px,
    rgba(0,0,0,.18) 21px,
    #b8a07e 24px,
    #ccbb9a 90px,
    #e0d5be 220px
  );
  border-top-left-radius: 10px;
  pointer-events: none;
  z-index: 10;
  transition:
    width  .54s cubic-bezier(0.4, 0, 0.1, 1),
    height .54s cubic-bezier(0.4, 0, 0.1, 1);
}
.notebook-card:hover .peel-corner {
  width: 60px; height: 60px;
}
.notebook-card.peeling .peel-corner {
  width: 900px; height: 900px;
}

/* ── Torn left border (faux torn strip) ── */
.torn-strip {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: clamp(36px, 5.5vw, 52px);
  background-color: #ede8d8;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 27px,
      rgba(110,160,200,.35) 27px,
      rgba(110,160,200,.35) 28px
    );
  border-right: 1px solid #cfc4a8;
  /* rough right edge using clip-path */
  clip-path: polygon(
    0% 0%, 100% 0%,
    98% 4%, 100% 8%, 97% 12%, 100% 16%,
    98% 20%, 100% 24%, 97% 28%, 100% 32%,
    98% 36%, 100% 40%, 97% 44%, 100% 48%,
    98% 52%, 100% 56%, 97% 60%, 100% 64%,
    98% 68%, 100% 72%, 97% 76%, 100% 80%,
    98% 84%, 100% 88%, 97% 92%, 100% 96%,
    98% 100%, 0% 100%
  );
  box-shadow: 2px 0 6px rgba(80,60,20,.12);
  flex-shrink: 0;
}
.torn-strip-holes {
  position: absolute;
  top: 22px; bottom: 22px; left: 0; right: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  align-items: center;
  pointer-events: none;
}
.torn-hole {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #f5f0e2;
  border: 1.5px solid #a89878;
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.2),
    0 1px 0 rgba(255,255,255,.4);
}
</style>
{% endblock %}

{% block content %}
<div class="mode-wrap">
  <h1 class="mode-heading">Where do you want to start?</h1>
  <p class="mode-sub">Choose how you want to build your meal plan.</p>

  <div class="mode-cards-row">

    <!-- Recipe suggestions -->
    <form id="form-suggestions" action="/mode" method="post" style="flex:1;display:flex;">
      <input type="hidden" name="mode" value="suggestions" />
      <button type="button" class="notebook-card" style="width:100%;display:flex;align-items:stretch;" data-form="form-suggestions">
        <!-- torn left strip -->
        <div class="torn-strip" style="position:relative;">
          <div class="torn-strip-holes">
            <div class="torn-hole"></div>
            <div class="torn-hole"></div>
            <div class="torn-hole"></div>
            <div class="torn-hole"></div>
            <div class="torn-hole"></div>
          </div>
        </div>
        <!-- paper body -->
        <div class="notebook-inner" style="flex:1;">
          <div class="notebook-card-title">Recipe suggestions</div>
          <div class="notebook-card-desc">Get recipe ideas built around shared ingredients. Browse and add what you want, we build your grocery list automatically.</div>
          <div class="notebook-card-arrow">Get started <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
          <div class="peel-corner"></div>
        </div>
      </button>
    </form>

    <!-- Or divider -->
    <div class="mode-or">
      <div class="mode-or-line"></div>
      <span class="mode-or-text">or</span>
      <div class="mode-or-line"></div>
    </div>

    <!-- Use my ingredients -->
    <form id="form-existing" action="/mode" method="post" style="flex:1;display:flex;">
      <input type="hidden" name="mode" value="existing" />
      <button type="button" class="notebook-card" style="width:100%;display:flex;align-items:stretch;" data-form="form-existing">
        <!-- torn left strip -->
        <div class="torn-strip" style="position:relative;">
          <div class="torn-strip-holes">
            <div class="torn-hole"></div>
            <div class="torn-hole"></div>
            <div class="torn-hole"></div>
            <div class="torn-hole"></div>
            <div class="torn-hole"></div>
          </div>
        </div>
        <!-- paper body -->
        <div class="notebook-inner" style="flex:1;">
          <div class="notebook-card-title">Use my ingredients</div>
          <div class="notebook-card-desc">Tell us what you already have. We suggest recipes that use them and only list the gaps on your grocery list.</div>
          <div class="notebook-card-arrow">Get started <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
          <div class="peel-corner"></div>
        </div>
      </button>
    </form>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
  var cards = document.querySelectorAll('.notebook-card');
  var peeling = false;

  cards.forEach(function(card) {
    card.addEventListener('click', function() {
      if (peeling) return;
      peeling = true;

      /* peel every card simultaneously */
      cards.forEach(function(c) { c.classList.add('peeling'); });

      /* submit the form this button belongs to after animation */
      var formId = card.getAttribute('data-form');
      var form = document.getElementById(formId);
      setTimeout(function() {
        if (form) form.submit();
      }, 560);
    });
  });
})();
</script>
{% endblock %}
